name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests (lib/utils, lib/permissions, lib/validators)
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Dummy values so `next build` can statically analyze pages that
          # reference env vars — real secrets are injected at deploy time
          # (see DEPLOYMENT.md). Build does not connect to any live service.
          MONGODB_URI: mongodb://localhost:27017/shah-international-ci
          NEXTAUTH_SECRET: ci-build-placeholder-secret-not-for-production
          NEXTAUTH_URL: http://localhost:3000
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_placeholder
          STRIPE_SECRET_KEY: sk_test_placeholder
          CLOUDINARY_CLOUD_NAME: placeholder
          CLOUDINARY_API_KEY: placeholder
          CLOUDINARY_API_SECRET: placeholder
